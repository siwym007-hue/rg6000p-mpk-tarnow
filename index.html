<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#078ac5"><title>R&G 6000P Simulator</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--blue:#078ac5;--blue2:#056b9e;--bg:#050b10;--panel:#101b24;--line:#263b49;--txt:#f4f8fb;--muted:#a9bac5;--orange:#ffad18;--green:#49d18b}*{box-sizing:border-box}body{margin:0;background:#020609;touch-action:pan-y;color:var(--txt);font:15px Arial,sans-serif;min-height:100vh}.device{max-width:1100px;min-height:100vh;margin:auto;background:#000;border:7px solid #17212a;border-radius:17px;display:flex;flex-direction:column;overflow:hidden}.statusbar{display:flex;justify-content:space-between;padding:9px 14px;background:#071018;color:#d9e5eb;font-weight:bold}.screen{padding:13px;flex:1}.brand{color:#62c9f5;font-weight:bold;letter-spacing:2px;font-size:13px}.hero{text-align:center;padding:7vh 15px 5vh}.logo{font-size:64px;margin-bottom:12px}.hero h1{font-size:clamp(27px,5vw,48px);margin:6px}.hero p{color:var(--muted)}button,.btn{pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.18);border:0;border-radius:8px;padding:13px 15px;background:linear-gradient(#14a8e3,#087eb6);color:white;font-weight:bold;font-size:15px;cursor:pointer}button.secondary{background:#263945}button.danger{background:#9d3540}button.green{background:#14794e}.primary{width:min(340px,100%);font-size:18px;padding:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.tile{min-height:88px;text-align:left;background:#10212d;border:1px solid #234456;padding:17px}.tile b{display:block;font-size:17px;margin:6px 0}.tile span{color:var(--muted);font-size:13px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}.heading h2{margin:0;font-size:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.field{margin:10px 0}.field label{display:block;color:#c6d4dc;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:12px;background:#07121a;border:1px solid #536b7a;border-radius:7px;color:white;font-size:16px}.field textarea{min-height:75px}.muted{color:var(--muted)}.listitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #263844}.listitem:last-child{border:0}.small{font-size:12px;color:var(--muted)}.pill{padding:4px 8px;border-radius:5px;background:#dceaf1;color:#12364b;font-size:12px;font-weight:bold}.linebar{background:var(--blue);border-radius:8px;padding:13px;font-size:clamp(20px,4vw,29px);font-weight:bold}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.metric{background:#101b24;border-radius:8px;padding:10px}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric strong{font-size:18px}.stop{background:#087eb6;padding:12px;border-radius:7px;margin:6px 0;display:flex;gap:12px;align-items:center}.stop.current{outline:3px solid white;background:#075f91}.stop.done{opacity:.48}.stop .num{min-width:44px;font-weight:bold}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button{flex:1;min-width:90px}.bottom{display:flex;justify-content:space-between;gap:8px;padding:9px;background:#071018;align-items:center;font-size:12px}.hidden{display:none!important}.notice{padding:12px;border-radius:8px;background:#102b3a;border:1px solid #1c6689;margin:10px 0}.good{color:var(--green)}.warn{color:var(--orange)}.empty{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:600px){.device{border:0;border-radius:0}.screen{padding:10px}.hero{padding-top:9vh}.metrics{grid-template-columns:repeat(2,1fr)}.heading h2{font-size:19px}.bottom{font-size:10px}}
</style></head><body><div class="device"><div class="statusbar"><span>R&G · SRG 6000P SIMULATOR</span><span id="clock">--:--:--</span></div><main class="screen" id="app"></main><footer class="bottom"><span id="gpsStatus">GPS: nieaktywny</span><span id="footStatus">SYSTEM GOTOWY</span><button class="secondary" onclick="goHome()">MENU</button></footer></div>
<script>
const KEY='rg6000p_v2';let db=load(),page='start',selectedLine=null,selectedDirection=0,active=false,stopIndex=0,gpsWatch=null,lastFix=null,arrived=new Set(),toastTimer,inZone=false,doorsOpen=false,spokenStops=new Set();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{lines:[],crews:[],stops:[],announcements:[],vehicle:'—',zone:100}}catch(e){return{lines:[],crews:[],stops:[],announcements:[],vehicle:'—',zone:100}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Nie można zapisać danych. Otwórz aplikację w Chrome i zezwól na pamięć witryny.');return false}}if(!Array.isArray(db.announcements))db.announcements=[];db.crews=[];db.audioSlots={};db.lines.forEach(l=>{if(!Array.isArray(l.directionStopIds))l.directionStopIds=[l.stopIds||[],l.stopIds||[]];if(!Array.isArray(l.directions))l.directions=['Kierunek 1','Kierunek 2'];while(l.directions.length<2)l.directions.push('Kierunek '+(l.directions.length+1));while(l.directionStopIds.length<l.directions.length)l.directionStopIds.push(l.stopIds||[])});if(!db.vehicle)db.vehicle='—';if(!db.audioSlots)db.audioSlots={};if(typeof db.published!=='boolean')db.published=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(id){return document.getElementById(id)}function clock(){el('clock').textContent=new Date().toLocaleTimeString('pl-PL')}setInterval(clock,1000);clock();function setPage(p){if(db.published&&['lines','stops','announcements'].includes(p)){alert('Konfiguracja jest zablokowana przez administratora.');return}page=p;render()}function goHome(){stopGPS();active=false;setPage('home')}function toast(t){el('footStatus').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('footStatus').textContent=active?'KURS W TOKU':'SYSTEM GOTOWY',2600)}function lineById(id){return db.lines.find(x=>x.id===id)}function stopsFor(line,direction=selectedDirection){let ids=line?.directionStopIds?.[direction];if(!Array.isArray(ids))ids=line?.stopIds||[];return ids.map(id=>db.stops.find(s=>s.id===id)).filter(Boolean)}function render(){let a=el('app');if(page==='start'){a.innerHTML=`<section class="hero"><div class="logo">🚌</div><div class="brand">SYSTEM STEROWANIA POJAZDEM</div><h1>R&G 6000P</h1><p>Symulator sterownika pokładowego</p><p class="small">MPK TARNÓW · WERSJA 0.8</p><button class="primary" onclick="setPage('home')">URUCHOM STEROWNIK</button></section><div class="notice">Urządzenie demonstracyjne. Dane linii i przystanków dodajesz samodzielnie w konfiguracji.</div>`;return}
if(page==='home'){a.innerHTML=`<div class="heading"><div><div class="brand">MENU GŁÓWNE</div><h2>Wybierz funkcję</h2></div><span class="pill">GOTOWY</span></div><div class="grid"><button class="tile" onclick="setPage('choose')">▶<b>Wybór kursu</b><span>Wybierz linię i kierunek</span></button><button class="tile ${db.published?'hidden':''}" onclick="setPage('lines')">⇄<b>Linie i trasy</b><span>Dodawanie i edycja linii</span></button><button class="tile ${db.published?'hidden':''}" onclick="setPage('stops')">📍<b>Przystanki</b><span>Baza przystanków i współrzędne GPS</span></button><button class="tile ${db.published?'hidden':''}" onclick="setPage('announcements')">🔊<b>Komunikaty głosowe</b><span>Zapowiedzi przystankowe i dodatkowe</span></button><button class="tile" onclick="setPage('settings')">⚙<b>Ustawienia</b><span>Pojazd, GPS i publikacja bazy</span></button><button class="tile" onclick="setPage('start')">⏻<b>Wyłącz sterownik</b><span>Powrót do ekranu startowego</span></button></div><div class="notice">Baza: ${db.lines.length} linii · ${db.stops.length} przystanków</div>`;return}
if(page==='lines'){a.innerHTML=`<div class="heading"><h2>Linie i trasy</h2><button onclick="lineForm()">＋ Dodaj linię</button></div>${db.lines.length?db.lines.map(l=>`<div class="card"><div class="listitem"><div><b>Linia ${esc(l.number)} · ${esc(l.name)}</b><div class="small">${(l.directionStopIds||[]).map(x=>x.length).join(' / ')} przystanków · ${(l.directions||[]).length} kierunków</div></div><div class="row"><button onclick="lineForm('${l.id}')">Edytuj</button><button class="danger" onclick="delLine('${l.id}')">Usuń</button></div></div></div>`).join(''):`<div class="empty">Nie dodano jeszcze żadnej linii.<br>Użyj „Dodaj linię”, aby utworzyć pierwszą trasę.</div>`}<button class="secondary" onclick="setPage('home')">← Wróć</button>`;return}
if(page==='stops'){a.innerHTML=`<div class="heading"><h2>Baza przystanków</h2><button onclick="stopForm()">＋ Dodaj przystanek</button></div><div class="notice">Każdy przystanek powinien mieć współrzędne GPS. Możesz pobrać bieżącą pozycję telefonu podczas dodawania.</div>${db.stops.length?db.stops.map(s=>`<div class="card"><div class="listitem"><div><b>${esc(s.name)}</b><div class="small">${s.lat!=null?Number(s.lat).toFixed(5)+', '+Number(s.lon).toFixed(5):'Brak współrzędnych'} · promień ${s.radius||db.zone} m</div></div><div class="row"><button onclick="stopForm('${s.id}')">Edytuj</button><button class="danger" onclick="delStop('${s.id}')">Usuń</button></div></div></div>`).join(''):`<div class="empty">Baza przystanków jest pusta. Dodaj przystanki, aby skonfigurować trasy i GPS.</div>`}<button class="secondary" onclick="setPage('home')">← Wróć</button>`;return}
if(page==='announcements'){a.innerHTML=`<div class="heading"><h2>Komunikaty dodatkowe</h2><button onclick="announcementForm()">＋ Dodaj</button></div><div class="notice">Podstawowe zapowiedzi przystanków są generowane przez syntezator mowy. Tutaj dodajesz własne nagrania MP3, WAV, M4A lub OGG, które można odtwarzać ręcznie podczas kursu.</div>${db.announcements.length?db.announcements.map((m,i)=>`<div class="card"><b>${esc(m.title||'Komunikat '+(i+1))}</b><div class="small">${esc(m.audioName||'Brak nagrania')} · ${m.trigger==='manual'?'ręczny':'automatyczny'}</div><div class="toolbar"><button class="secondary" onclick="speakAnnouncement(${i})">▶ Odsłuchaj</button><button onclick="announcementForm(${i})">Edytuj</button><button class="danger" onclick="deleteAnnouncement(${i})">Usuń</button></div></div>`).join(''):'<div class="empty">Nie dodano jeszcze komunikatów dodatkowych.</div>'}<button class="secondary" onclick="setPage('home')">← Wróć</button>`;return}
if(page==='settings'){a.innerHTML=`<h2>Ustawienia sterownika</h2><div class="card"><div class="field"><label>Numer pojazdu</label><input id="vehicle" value="${esc(db.vehicle)}"></div><div class="field"><label>Domyślny promień strefy przystankowej (metry)</label><input id="zone" type="number" min="20" max="500" value="${db.zone}"></div><button onclick="saveSettings()">Zapisz ustawienia</button></div><div class="card"><b>Udostępnianie gotowej konfiguracji</b><p class="small">Eksportuj przygotowaną bazę linii, kierunków, przystanków i komunikatów dodatkowych. Inny użytkownik może ją zaimportować i korzystać w trybie tylko do odczytu.</p><button onclick="exportPackage()">⬇ Eksportuj gotową bazę</button><div class="field"><label>Import gotowej bazy</label><input type="file" accept="application/json,.json" id="packageFile" onchange="importPackage(this)"></div><div class="small">Tryb: ${db.published?'UŻYTKOWNIK – konfiguracja zablokowana':'ADMINISTRATOR – edycja dozwolona'}</div>${db.published?'<button class="danger" onclick="unlockAdmin()">Odblokuj edycję administratora</button>':'<button class="green" onclick="publishMode()">Zablokuj konfigurację na tym urządzeniu</button>'}</div><div class="notice"><b>Lokalizacja GPS</b><p id="gpsHelp">${window.isSecureContext?'Bezpieczny kontekst aktywny. Naciśnij przycisk i zezwól Chrome na lokalizację.':'Brak bezpiecznego kontekstu. Na Androidzie plik HTML otwarty lokalnie (file://) zwykle nie wywoła okna zgody. Potrzebny jest adres HTTPS lub natywna aplikacja.'}</p><button class="secondary" onclick="testGPS()">◎ Poproś o dostęp i sprawdź GPS</button><p class="small">Jeśli używasz Androida: włącz lokalizację systemową i w ustawieniach Chrome zezwól tej stronie na lokalizację. Samo dodanie strony do ekranu głównego nie naprawia połączenia file://.</p></div><button class="secondary" onclick="setPage('home')">← Wróć</button>`;return}
if(page==='choose'){a.innerHTML=`<div class="heading"><h2>Wybór kursu</h2><span class="pill">NOWY KURS</span></div>${db.lines.length?`<div class="field"><label>Linia</label><select id="pickLine" onchange="refreshCoursePick()">${db.lines.map(l=>`<option value="${l.id}">${esc(l.number)} · ${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>Kierunek</label><select id="pickDir"></select></div><div class="field"><label>Numer pojazdu</label><input id="pickVehicle" value="${esc(db.vehicle)}"></div><div class="notice">Wybierz linię oraz kierunek jazdy.</div><button class="primary" onclick="startCourse()">ZATWIERDŹ I ROZPOCZNIJ</button>`:`<div class="empty">Nie ma jeszcze żadnych linii. Najpierw dodaj linię i przypisz przystanki do obu kierunków.</div>`}<div style="margin-top:15px"><button class="secondary" onclick="setPage('home')">← Wróć</button></div>`;if(db.lines.length)refreshCoursePick();return}
if(page==='driver'){let l=lineById(selectedLine),ss=stopsFor(l,selectedDirection),cur=ss[stopIndex];a.innerHTML=`<div class="heading"><b>Linia / Kierunek</b><span class="time">${new Date().toLocaleTimeString('pl-PL')}</span></div><div class="linebar">${esc(l?.number||'—')}　${esc(l?.directions?.[selectedDirection]||'Kierunek')}</div><div class="metrics"><div class="metric"><small>Przystanek</small><strong>${ss.length?stopIndex+1:0}/${ss.length}</strong></div><div class="metric"><small>Nr pojazdu</small><strong>${esc(db.vehicle)}</strong></div><div class="metric"><small>GPS</small><strong id="gpsMetric">${lastFix?'AKTYWNY':'—'}</strong></div><div class="metric"><small>Strefa</small><strong>${cur?cur.radius||db.zone:db.zone} m</strong></div><div class="metric"><small>Status</small><strong class="${inZone?'good':'warn'}">${inZone?'W STREFIE':'W TRASIE'}</strong></div></div><div class="row"><button onclick="toggleGPS()" id="gpsBtn">${gpsWatch?'Wyłącz GPS':'Włącz GPS'}</button><button class="secondary" onclick="setPage('home')">Menu</button></div><div class="card"><b>Obsługa przystanku</b><p>${esc(cur?.name||'Brak przystanku')}</p><p class="small">Strefa GPS: ${inZone?'WYKRYTA':'NIEWYKRYTA'} · Drzwi: ${doorsOpen?'OTWARTE':'ZAMKNIĘTE'}</p><div class="toolbar"><button class="${doorsOpen?'danger':'green'}" onclick="toggleDoors()">${doorsOpen?'Zamknij drzwi':'Otwórz drzwi'}</button><button onclick="manualConfirmStop()" ${(!inZone||!doorsOpen)?'disabled':''}>✓ ZALICZ PRZYSTANEK</button></div><div class="small">Zaliczenie wymaga wykrycia strefy GPS, otwarcia drzwi i naciśnięcia „ZALICZ PRZYSTANEK”. Jeśli opuścisz strefę bez zaliczenia, sterownik automatycznie przejdzie do następnego przystanku.</div></div>${db.announcements.length?`<div class="card"><b>Komunikaty dodatkowe</b><div class="toolbar">${db.announcements.map((m,i)=>`<button class="secondary" onclick="speakAnnouncement(${i})">▶ ${esc(m.title||'Komunikat '+(i+1))}</button>`).join('')}</div></div>`:''}<h3>Przystanki na trasie</h3>${ss.map((s,i)=>`<div class="stop ${i===stopIndex?'current':i<stopIndex?'done':''}"><span class="num">${i+1}.</span><span>${esc(s.name)}${i===stopIndex?'<div class="small">← AKTUALNY PRZYSTANEK</div>':''}</span>${i<stopIndex?'✓':''}</div>`).join('')}<div class="toolbar"><button class="secondary" onclick="moveStop(-1)">◀ Poprzedni</button><button class="secondary" onclick="moveStop(1)">Następny ▶</button></div><div class="toolbar"><button class="danger" onclick="endCourse()">Zakończ kurs</button></div><div class="notice" id="gpsInfo">${lastFix?`Pozycja: ${lastFix.lat.toFixed(5)}, ${lastFix.lon.toFixed(5)} · dokładność ±${Math.round(lastFix.accuracy)} m`:'Włącz GPS, aby wykrywać zdefiniowane strefy przystankowe.'}</div>`;return}}
let lineDirectionCount=2;
function lineForm(id){if(db.published){alert('Konfiguracja jest zablokowana.');return}let l=id?lineById(id):null;let dirs=l?.directions?.length?l.directions:['Kierunek 1','Kierunek 2'];lineDirectionCount=Math.max(2,dirs.length);let names=ids=>(ids||[]).map(x=>db.stops.find(s=>s.id===x)?.name).filter(Boolean).join('\n');el('app').innerHTML=`<h2>${l?'Edycja linii':'Nowa linia'}</h2><div class="card"><div class="field"><label>Numer linii</label><input id="lnNum" value="${esc(l?.number||'')}"></div><div class="field"><label>Nazwa / opis</label><input id="lnName" value="${esc(l?.name||'')}"></div><div id="directionsEditor">${dirs.map((d,i)=>directionEditorHtml(i,d,l?.directionStopIds?.[i]||l?.stopIds||[])).join('')}</div><button type="button" class="secondary" onclick="addDirection()">＋ Dodaj kierunek</button><p class="small">Każdy kierunek ma własną nazwę i listę przystanków w kolejności przejazdu. Ostatni przystanek danego kierunku jest automatycznie traktowany jako końcowy.</p><button onclick="saveLine('${id||''}')">Zapisz linię</button> <button class="secondary" onclick="setPage('lines')">Anuluj</button></div>`}
function directionEditorHtml(i,d,ids){return `<div class="card" id="directionCard${i}"><div class="heading"><b>Kierunek ${i+1}</b>${i>=2?`<button type="button" class="danger" onclick="removeDirection(${i})">Usuń kierunek</button>`:''}</div><div class="field"><label>Nazwa kierunku</label><input id="dirName${i}" value="${esc(d||'Kierunek '+(i+1))}"></div><div class="field"><label>Przystanki kierunku ${i+1} – jeden przystanek w każdym wierszu</label><textarea id="route${i}" placeholder="Pierwszy przystanek&#10;Drugi przystanek&#10;Trzeci przystanek">${esc((ids||[]).map(x=>db.stops.find(s=>s.id===x)?.name).filter(Boolean).join('\n'))}</textarea></div></div>`}
function addDirection(){let i=lineDirectionCount++;el('directionsEditor').insertAdjacentHTML('beforeend',directionEditorHtml(i,'Kierunek '+(i+1),[]))}
function removeDirection(i){let card=el('directionCard'+i);if(card)card.remove();/* Keep indexes stable; removed entries are ignored while saving. */}
function saveLine(id){let number=el('lnNum').value.trim(),name=el('lnName').value.trim();if(!number||!name)return alert('Wpisz numer i nazwę linii.');let directions=[],directionStopIds=[];for(let i=0;i<lineDirectionCount;i++){let nameEl=el('dirName'+i),routeEl=el('route'+i);if(!nameEl||!routeEl)continue;let directionName=nameEl.value.trim()||'Kierunek '+(i+1);let routeNames=routeEl.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean),ids=[];for(let n of routeNames){let stop=db.stops.find(s=>s.name.toLowerCase()===n.toLowerCase());if(!stop){alert('Nie znaleziono przystanku: '+n+'. Najpierw dodaj go do bazy lub popraw nazwę.');return}ids.push(stop.id)}if(!ids.length)return alert('Dodaj przystanki dla kierunku: '+directionName+'.');directions.push(directionName);directionStopIds.push(ids)}if(directions.length<2)return alert('Linia musi mieć co najmniej dwa kierunki.');let obj={id:id||crypto.randomUUID(),number,name,directions,directionStopIds,stopIds:directionStopIds[0]};if(id)db.lines[db.lines.findIndex(x=>x.id===id)]=obj;else db.lines.push(obj);save();setPage('lines')}
function delLine(id){if(confirm('Usunąć linię?')){db.lines=db.lines.filter(l=>l.id!==id);save();render()}}
function stopForm(id){if(db.published){alert('Konfiguracja jest zablokowana.');return}let s=id?db.stops.find(x=>x.id===id):null;el('app').innerHTML=`<h2>${s?'Edycja przystanku':'Nowy przystanek'}</h2><div class="card"><div class="field"><label>Nazwa przystanku</label><input id="stName" value="${esc(s?.name||'')}"></div><div class="row"><div class="field"><label>Szerokość geograficzna</label><input id="stLat" type="number" step="any" value="${s?.lat??''}"></div><div class="field"><label>Długość geograficzna</label><input id="stLon" type="number" step="any" value="${s?.lon??''}"></div></div><div class="field"><label>Promień strefy (metry)</label><input id="stRadius" type="number" value="${s?.radius||db.zone}"></div><div class="field"><label>Zapowiedź głosowa tego przystanku</label><textarea id="stAnnouncement" placeholder="Nazwa przystanku (opcjonalna korekta wymowy)">${esc(s?.announcement||'')}</textarea></div><button class="secondary" onclick="previewStopAnnouncement()">▶ Odsłuchaj zapowiedź</button><p class="small">Jeśli pole pozostawisz puste, aplikacja użyje domyślnej zapowiedzi z nazwą przystanku.</p><button class="secondary" onclick="useCurrentPosition()">◎ Pobierz moją lokalizację</button><p class="small">Wymaga zgody na lokalizację i połączenia HTTPS lub lokalnego środowiska.</p><button onclick="saveStop('${id||''}')">Zapisz przystanek</button> <button class="secondary" onclick="setPage('stops')">Anuluj</button></div>`}
function useCurrentPosition(){if(!navigator.geolocation)return alert('Geolokalizacja nie jest dostępna.');navigator.geolocation.getCurrentPosition(p=>{el('stLat').value=p.coords.latitude;el('stLon').value=p.coords.longitude},e=>alert('Nie udało się pobrać lokalizacji: '+e.message),{enableHighAccuracy:true,timeout:15000})}
async function saveStop(id){let name=el('stName').value.trim(),lat=el('stLat').value,lon=el('stLon').value;if(!name)return alert('Wpisz nazwę przystanku.');if((lat===''||lon==='')&& !confirm('Nie podano współrzędnych. Zapisać bez GPS?'))return;let o={id:id||crypto.randomUUID(),name,lat:lat===''?null:Number(lat),lon:lon===''?null:Number(lon),radius:Number(el('stRadius').value)||db.zone,announcement:el('stAnnouncement').value.trim()};if(id)db.stops[db.stops.findIndex(x=>x.id===id)]=o;else db.stops.push(o);save();setPage('stops')}
let currentAudio=null;let audioQueue=Promise.resolve();let audioRunToken=0;function saveAudioSlot(k,input){let f=input.files&&input.files[0];if(!f)return;if(f.size>700000){alert('Plik jest za duży dla obecnego magazynu przeglądarki. Wybierz krótsze nagranie do 700 KB.');input.value='';return}let r=new FileReader();r.onload=()=>{db.audioSlots=db.audioSlots||{};db.audioSlots[k]={name:f.name,type:f.type,data:r.result};if(save())render()};r.onerror=()=>alert('Nie udało się odczytać pliku audio.');r.readAsDataURL(f)}function playAudioSlot(k,fallback){const slot=db.audioSlots?.[k];if(!slot?.data){return fallback?speakText(fallback):Promise.resolve()}return new Promise(resolve=>{try{const audio=new Audio(slot.data);currentAudio=audio;let finished=false;const done=()=>{if(finished)return;finished=true;if(currentAudio===audio)currentAudio=null;resolve()};audio.addEventListener('ended',done,{once:true});audio.addEventListener('error',()=>{if(fallback)speakText(fallback).then(done);else done()},{once:true});const result=audio.play();if(result&&result.catch)result.catch(()=>{if(fallback)speakText(fallback).then(done);else done()})}catch(e){if(fallback)speakText(fallback).then(resolve);else resolve()}})}function queueAudioSlot(k,fallback){audioQueue=audioQueue.then(()=>playAudioSlot(k,fallback)).catch(()=>{});return audioQueue}function stopAnnouncements(){audioRunToken++;audioQueue=Promise.resolve();if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}function clearAudioSlot(k){if(!db.audioSlots?.[k])return;delete db.audioSlots[k];save();render()}function exportPackage(){let data={format:'RG6000P-PACKAGE-2',created:new Date().toISOString(),db:{...db,published:true}};let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rg6000p-gotowa-konfiguracja.json';a.click();URL.revokeObjectURL(url);toast('Wyeksp function pickPolishMaleVoice(){if(!('speechSynthesis'in window))return null;let vs=speechSynthesis.getVoices()||[],pl=vs.filter(v=>(v.lang||'').toLowerCase().startsWith('pl'));if(!pl.length)return null;let male=pl.find(v=>/male|męsk|mesk|man|masculine|masculin|male_?\d/i.test((v.name||'')+' '+(v.voiceURI||'')));return male||pl[0]}function speakText(text){return new Promise(resolve=>{if(!('speechSynthesis'in window)){toast('Brak syntezatora mowy w tej przeglądarce');resolve();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(text||''));u.lang='pl-PL';u.rate=0.91;u.pitch=0.78;let v=pickPolishMaleVoice();if(v)u.voice=v;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}function speakAnnouncement(i){let m=db.announcements[i];if(!m)return;audioQueue=audioQueue.then(()=>m.data?playDataAudio(m.data):speakText(m.text||m.title)).catch(()=>{})}function playDataAudio(data){return new Promise(resolve=>{let a=new Audio(data),done=()=>{if(currentAudio===a)currentAudio=null;resolve()};currentAudio=a;a.addEventListener('ended',done,{once:true});a.addEventListener('error',done,{once:true});let p=a.play();if(p?.catch)p.catch(done)})}function previewStopAnnouncement(){let t=el('stAnnouncement').value.trim()||('Przystanek '+el('stName').value.trim());speakText(t)}function announcementForm(i){if(db.published){alert('Konfiguracja jest zablokowana.');return}let m=i==null?null:db.announcements[i];el('app').innerHTML=`<h2>${m?'Edycja':'Nowy'} komunikat dodatkowy</h2><div class="card"><div class="field"><label>Nazwa komunikatu</label><input id="extraTitle" value="${esc(m?.title||'')}"></div><div class="field"><label>Plik z nagraniem (MP3/WAV/M4A/OGG)</label><input id="extraAudio" type="file" accept="audio/*"><div class="small">${m?.audioName?'Obecne nagranie: '+esc(m.audioName):'Wybierz własne nagranie.'}</div></div><div class="field"><label>Tekst awaryjny (opcjonalnie, gdy brak pliku)</label><textarea id="extraText">${esc(m?.text||'')}</textarea></div><button onclick="saveAnnouncement(${i==null?-1:i})">Zapisz komunikat</button> <button class="secondary" onclick="setPage('announcements')">Anuluj</button></div>`}async function saveAnnouncement(i){let title=el('extraTitle').value.trim(),file=el('extraAudio').files?.[0],old=i<0?null:db.announcements[i];if(!title)return alert('Podaj nazwę komunikatu.');if(!file&&!old?.data&&!el('extraText').value.trim())return alert('Wybierz nagranie albo wpisz tekst awaryjny.');if(file&&file.size>2500000)return alert('Nagranie jest za duże (limit 2,5 MB na plik).');let data=old?.data||null;if(file)data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});let o={title,data,audioName:file?.name||old?.audioName||'',text:el('extraText').value.trim()};if(i<0)db.announcements.push(o);else db.announcements[i]=o;if(save())setPage('announcements')}

function saveSettings(){db.vehicle=el('vehicle').value.trim()||'—';db.zone=Math.max(20,Math.min(500,Number(el('zone').value)||100));save();toast('Ustawienia zapisane');setPage('home')}
function refreshCoursePick(){let id=el('pickLine')?.value,l=lineById(id);if(!l)return;el('pickDir').innerHTML=(l.directions||['Kierunek 1','Kierunek 2']).map((d,i)=>`<option value="${i}">${esc(d)}</option>`).join('')}
function startCourse(){let l=lineById(el('pickLine').value);if(!l)return alert('Wybierz linię.');selectedDirection=Number(el('pickDir').value)||0;if(!stopsFor(l,selectedDirection).length)return alert('Ten kierunek nie ma przystanków. Edytuj linię i przypisz przystanki do wybranego kierunku.');selectedLine=l.id;db.vehicle=el('pickVehicle').value||db.vehicle;save();stopIndex=0;arrived.clear();spokenStops.clear();inZone=false;doorsOpen=false;active=true;stopAnnouncements();setPage('driver');toast('Kurs rozpoczęty');speakText(`Linia ${l.number}, kierunek ${l.directions[selectedDirection]||''}`).then(announceNext)}
function moveStop(n){let max=stopsFor(lineById(selectedLine),selectedDirection).length-1;stopIndex=Math.max(0,Math.min(max,stopIndex+n));inZone=false;doorsOpen=false;render()}function toggleDoors(){if(!inZone){toast('Nie wykryto strefy przystankowej – drzwi nie zostaną otwarte');return}doorsOpen=!doorsOpen;render();toast(doorsOpen?'Drzwi otwarte':'Drzwi zamknięte')}function manualConfirmStop(){let s=stopsFor(lineById(selectedLine),selectedDirection)[stopIndex];if(!s||!inZone||!doorsOpen){toast('Wymagana strefa GPS i otwarte drzwi');return}arrived.add(stopIndex);toast('Przystanek zaliczony: '+s.name);doorsOpen=false;inZone=false;if(stopIndex<stopsFor(lineById(selectedLine),selectedDirection).length-1)stopIndex++;render();setTimeout(announceNext,500)}

function startGPS(){if(!window.isSecureContext&&!['localhost','127.0.0.1'].includes(location.hostname)){alert('GPS wymaga HTTPS albo localhost. Otwórz aplikację z adresu HTTPS.');return}if(!navigator.geolocation){alert('Ta przeglądarka nie obsługuje geolokalizacji.');return}el('gpsStatus').textContent='GPS: oczekiwanie na zgodę/pozycję…';gpsWatch=navigator.geolocation.watchPosition(p=>{lastFix={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};el('gpsStatus').textContent='GPS: '+lastFix.lat.toFixed(4)+', '+lastFix.lon.toFixed(4);if(page==='driver'){let ss=stopsFor(lineById(selectedLine),selectedDirection),s=ss[stopIndex];if(s&&s.lat!=null&&s.lon!=null){let d=distance(lastFix.lat,lastFix.lon,s.lat,s.lon),wasInZone=inZone;inZone=d<=(s.radius||db.zone);if(inZone&&!wasInZone){toast('Wykryto strefę przystankową: '+s.name);if(!spokenStops.has(s.id)){spokenStops.add(s.id);announceArrival(s)}}else if(!inZone&&wasInZone){if(!arrived.has(s.id)){advanceAfterLeavingZone();return}else{doorsOpen=false;inZone=false}}}else{inZone=false}let info=el('gpsInfo');if(info)info.textContent=`Pozycja: ${lastFix.lat.toFixed(5)}, ${lastFix.lon.toFixed(5)} · dokładność ±${Math.round(lastFix.accuracy)} m`;let gm=el('gpsMetric');if(gm)gm.textContent='AKTYWNY';let status=el('footStatus');if(status)status.textContent=inZone?'STREFA PRZYSTANKOWA':'KURS W TOKU';if(el('app'))render()}},e=>{let m=e.code===1?'Brak zgody na lokalizację':e.code===2?'Telefon nie może ustalić pozycji – sprawdź lokalizację systemową':e.code===3?'Upłynął czas oczekiwania GPS':'Nieznany błąd lokalizacji';stopGPS();el('gpsStatus').textContent='GPS: BŁĄD '+e.code;toast(m+' (kod '+e.code+')')},{enableHighAccuracy:true,maximumAge:0,timeout:30000});el('gpsStatus').textContent='GPS: oczekiwanie na pozycję'}
function stopGPS(){if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}el('gpsStatus').textContent='GPS: nieaktywny'}function distance(a,b,c,d){const r=6371000,rad=x=>x*Math.PI/180,dl=rad(c-a),dn=rad(d-b),h=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 2*r*Math.asin(Math.sqrt(h))}

Object.assign(window,{setPage,goHome,announceArrival,playStopName,lineForm,delLine,stopForm,delStop,announcementForm,saveAnnouncement,deleteAnnouncement,speakAnnouncement,saveSettings,refreshCoursePick,startCourse,toggleGPS,toggleDoors,manualConfirmStop,moveStop,endCourse,saveLine,saveStop,useCurrentPosition,previewStopAnnouncement,saveAudioSlot,playAudioSlot,clearAudioSlot,exportPackage,importPackage,publishMode,unlockAdmin,testGPS,announceNext,stopAnnouncements,queueAudioSlot});
